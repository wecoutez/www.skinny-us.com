function log(m){var l=document.getElementById('log');l.style.display='block';l.textContent+=m+"\n";l.scrollTop=l.scrollHeight;}
async function run(){
  var key=document.getElementById('key').value.trim();
  if(!key){alert('API 키를 입력하세요');return;}
  document.getElementById('go').disabled=true;
  document.getElementById('bar').style.display='block';
  if(!window.google||!google.maps){
    log('구글 지도 SDK 로딩...');
    await new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&v=weekly&loading=async&callback=__gm';
      window.__gm=res; s.onerror=function(){rej(new Error('SDK 로딩 실패 — 키/API 활성화 확인'))};
      document.head.appendChild(s);
    });
  }
  var lib=await google.maps.importLibrary('places');
  var Place=lib.Place;
  var out={}, fail=[];
  for(var i=0;i<ENTRIES.length;i++){
    var it=ENTRIES[i];
    try{
      var r=await Place.searchByText({textQuery:it.q, fields:['photos','displayName'], maxResultCount:1,
        locationBias:{lat:37.5279,lng:127.0276,radius:30000}});
      var p=r.places&&r.places[0];
      var uri=p&&p.photos&&p.photos[0]&&p.photos[0].getURI({maxWidth:1000});
      if(uri){out[it.sid]=uri; log((i+1)+'/'+ENTRIES.length+' ✓ '+it.q.split(' ')[0]);}
      else{fail.push(it.q); log((i+1)+'/'+ENTRIES.length+' ✗ 사진없음 '+it.q.split(' ')[0]);}
    }catch(e){fail.push(it.q); log((i+1)+'/'+ENTRIES.length+' ✗ '+e.message);}
    document.getElementById('fill').style.width=Math.round((i+1)/ENTRIES.length*100)+'%';
    await new Promise(function(r){setTimeout(r,120)});
  }
  var ta=document.getElementById('out'); ta.style.display='block';
  ta.value=JSON.stringify(out);
  log('완료: 사진 '+Object.keys(out).length+'곳 / 실패 '+fail.length+'곳');
  log('아래 상자 내용을 전체 복사해서 Claude에게 붙여넣으세요.');
  ta.focus(); ta.select();
