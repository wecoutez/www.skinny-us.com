<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Welcome · Skinny-us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Yellowtail&family=Space+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --white:#FFFFFF; --cream:#FDFBF7; --line:#F1E9E0;
    --ink:#A8305C; --ink-mid:#C05A82; --ink-soft:#D0739A;
    --g1:#F8C8DA; --g2:#F0AEC4; --g3:#E095AE;
    --gx:20px;  /* section side padding */
    --gm:14px;  /* hero side margin */
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',sans-serif; color:var(--ink);
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; padding:32px 24px;
    background:linear-gradient(165deg, var(--g1) 0%, var(--g2) 45%, var(--g3) 100%);
  }
  .eyebrow { font-family:'Space Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.28em; text-transform:uppercase; color:rgba(255,255,255,0.95); }
  h1 { font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; font-size:clamp(40px,10vw,58px); color:#fff; text-shadow:0 2px 12px rgba(168,48,92,0.35); margin:12px 0 8px; }
  .sub { font-size:13.5px; color:rgba(255,255,255,0.95); max-width:400px; line-height:1.6; margin-bottom:26px; }
  .code-label { font-family:'Space Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.85); margin-bottom:8px; }
  .code {
    font-family:'Space Mono',monospace; font-size:30px; font-weight:700; letter-spacing:0.24em;
    color:var(--ink); background:#fff; padding:16px 26px 16px 32px; border-radius:20px;
    box-shadow:0 14px 30px rgba(168,48,92,0.3); margin-bottom:10px; user-select:all;
  }
  .hint { font-size:11.5px; color:rgba(255,255,255,0.85); margin-bottom:28px; }
  .go {
    display:block; width:100%; max-width:380px; text-decoration:none;
    font-size:14.5px; font-weight:700; color:#111; padding:15px 16px; border-radius:20px;
    background:#fff; box-shadow:0 14px 30px rgba(168,48,92,0.3);
  }
  .steps { font-size:12px; color:rgba(255,255,255,0.9); margin-top:16px; line-height:1.7; }
</style>
</head>
<body>
  <div class="eyebrow">Payment confirmed · Skinny Genius</div>
  <h1>Welcome in.</h1>
  <div class="sub">Thank you for joining Skinny-us. Here's your access code — it unlocks the full list for 30 days.</div>
  <div class="code-label">Your access code</div>
  <div class="code">SEOUL26</div>
  <div class="hint">Tap to select · screenshot this page to keep it</div>
  <a class="go" href="index.html#/gate">Enter your code →</a>
  <div class="steps">The code box opens automatically — type <b>SEOUL26</b> and you're in.</div>
</body>
</html>
