<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Visitors · SKNYUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Yellowtail&family=Space+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#fff; --cream:#FDFBF7; --line:#F1E9E0; --line2:#EADFD3;
    --ink:#A8305C; --ink-mid:#C05A82; --ink-soft:#D0739A;
    --g1:#F8C8DA; --g2:#F0AEC4;
    --black:#111;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Inter',sans-serif;background:var(--white);color:var(--black);}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;background:rgba(255,252,250,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .tb-left{display:flex;align-items:center;gap:10px;}
  .backchip{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:999px;
    border:1px solid var(--line);background:var(--cream);color:#111;font-size:15px;text-decoration:none;}
  .wordmark{font-family:'Yellowtail',cursive;font-size:24px;color:var(--ink);text-decoration:none;}
  .wordmark em{font-style:normal;color:var(--ink-soft);}
  .tb-right{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-mid);}

  .wrap{max-width:720px;margin:0 auto;padding:24px 20px 80px;}
  .title{font-family:'Instrument Serif',serif;font-style:italic;font-size:32px;line-height:1.1;}
  .sub{font-size:12px;color:var(--ink-mid);margin:6px 0 20px;}

  /* login */
  .in{width:100%;font-family:'Space Mono',monospace;font-size:16px;padding:14px;border-radius:18px;
    border:2px solid var(--line);outline:none;color:#111;background:var(--white);}
  .in:focus{border-color:#111;}
  .in + .in{margin-top:10px;}
  .btn{display:block;width:100%;margin-top:12px;padding:14px;border:none;border-radius:18px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:700;color:#111;background:linear-gradient(155deg,var(--g1),var(--g2));}
  .err{font-size:12px;color:#C0392B;margin-top:10px;display:none;line-height:1.5;}
  .hint{font-size:11.5px;color:var(--ink-mid);margin-top:14px;line-height:1.6;}

  /* range */
  .range{display:flex;gap:6px;margin-bottom:16px;}
  .range button{flex:1;padding:9px;border:1px solid var(--line);background:var(--white);border-radius:999px;
    font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;color:var(--ink-mid);cursor:pointer;}
  .range button.on{background:#111;border-color:#111;color:#fff;}

  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:8px;}
  .kpi{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:13px 14px;}
  .kpi b{display:block;font-family:'Space Mono',monospace;font-size:22px;color:#111;line-height:1.1;}
  .kpi span{font-size:10.5px;font-weight:600;color:var(--ink-mid);}

  .sec{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-mid);margin:26px 0 10px;}
  .sec small{text-transform:none;letter-spacing:0;font-family:'Inter',sans-serif;font-weight:500;color:var(--ink-soft);}

  /* bars */
  .bars{border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .bar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;}
  .bar:last-child{border-bottom:none;}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#FDEBF2,#FBF3F6);z-index:0;}
  .bar .lb,.bar .nb{position:relative;z-index:1;}
  .bar .lb{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar .nb{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-mid);flex:none;}
  .empty{padding:16px;border:1px dashed var(--line2);border-radius:16px;font-size:12.5px;color:var(--ink-mid);text-align:center;}

  /* daily sparkline */
  .spark{display:flex;align-items:flex-end;gap:3px;height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;}
  .spark i{flex:1;background:linear-gradient(180deg,var(--g2),var(--g1));border-radius:3px 3px 0 0;min-height:2px;display:block;}

  /* funnel */
  .fn{border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .fnrow{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;}
  .fnrow:last-child{border-bottom:none;}
  .fnrow b{font-family:'Space Mono',monospace;font-size:14px;}
  .fnrow em{font-style:normal;font-size:11px;color:var(--ink-soft);font-family:'Space Mono',monospace;margin-left:8px;}

  /* table */
  .tb{width:100%;border-collapse:collapse;font-size:11.5px;}
  .tb td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  .tb td:first-child{color:var(--ink-soft);white-space:nowrap;font-family:'Space Mono',monospace;}
  .tag{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700;
    font-family:'Space Mono',monospace;background:#F4F1EC;color:#555;}
  .tag.pay{background:#111;color:#fff;} .tag.join{background:var(--g1);color:#111;}
  .tag.pick{background:#EAF4EF;color:#2E6B4F;} .tag.member{background:#EDE9F7;color:#4B3B8F;}

  .foot{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;}
  .ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;
    font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-mid);cursor:pointer;text-decoration:none;}
</style>
</head>
<body>
  <div class="topbar">
    <span class="tb-left">
      <a class="backchip" href="index.html" aria-label="Back">←</a>
      <a class="wordmark" href="index.html">skinny-<em>us</em></a>
    </span>
    <span class="tb-right" id="tb-right"></span>
  </div>

  <div class="wrap" id="body"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   ⚠️ 여기 두 줄만 채우면 됩니다.
   1) ANALYTICS_API — sknyus-analytics Apps Script 배포 URL (.../exec)
   2) 비밀번호는 입력창에서 넣습니다 (= .gs 의 ADMIN_KEY)
   ═══════════════════════════════════════════════════════════ */
var ANALYTICS_API = "";   // 예: "https://script.google.com/macros/s/AKfycb.../exec"

/* ───────── 타임존 → 국가 ───────── */
var TZC = {
  "Asia/Seoul":["KR","🇰🇷","한국"], "Asia/Tokyo":["JP","🇯🇵","일본"],
  "Asia/Shanghai":["CN","🇨🇳","중국"], "Asia/Chongqing":["CN","🇨🇳","중국"],
  "Asia/Hong_Kong":["HK","🇭🇰","홍콩"], "Asia/Taipei":["TW","🇹🇼","대만"],
  "Asia/Singapore":["SG","🇸🇬","싱가포르"], "Asia/Kuala_Lumpur":["MY","🇲🇾","말레이시아"],
  "Asia/Bangkok":["TH","🇹🇭","태국"], "Asia/Jakarta":["ID","🇮🇩","인도네시아"],
  "Asia/Manila":["PH","🇵🇭","필리핀"], "Asia/Ho_Chi_Minh":["VN","🇻🇳","베트남"],
  "Asia/Saigon":["VN","🇻🇳","베트남"], "Asia/Kolkata":["IN","🇮🇳","인도"],
  "Asia/Calcutta":["IN","🇮🇳","인도"], "Asia/Dubai":["AE","🇦🇪","UAE"],
  "Asia/Riyadh":["SA","🇸🇦","사우디"], "Asia/Jerusalem":["IL","🇮🇱","이스라엘"],
  "Asia/Istanbul":["TR","🇹🇷","튀르키예"], "Europe/Istanbul":["TR","🇹🇷","튀르키예"],
  "Europe/London":["GB","🇬🇧","영국"], "Europe/Dublin":["IE","🇮🇪","아일랜드"],
  "Europe/Paris":["FR","🇫🇷","프랑스"], "Europe/Brussels":["BE","🇧🇪","벨기에"],
  "Europe/Amsterdam":["NL","🇳🇱","네덜란드"], "Europe/Berlin":["DE","🇩🇪","독일"],
  "Europe/Zurich":["CH","🇨🇭","스위스"], "Europe/Vienna":["AT","🇦🇹","오스트리아"],
  "Europe/Madrid":["ES","🇪🇸","스페인"], "Europe/Lisbon":["PT","🇵🇹","포르투갈"],
  "Europe/Rome":["IT","🇮🇹","이탈리아"], "Europe/Stockholm":["SE","🇸🇪","스웨덴"],
  "Europe/Oslo":["NO","🇳🇴","노르웨이"], "Europe/Copenhagen":["DK","🇩🇰","덴마크"],
  "Europe/Helsinki":["FI","🇫🇮","핀란드"], "Europe/Warsaw":["PL","🇵🇱","폴란드"],
  "Europe/Prague":["CZ","🇨🇿","체코"], "Europe/Budapest":["HU","🇭🇺","헝가리"],
  "Europe/Athens":["GR","🇬🇷","그리스"], "Europe/Moscow":["RU","🇷🇺","러시아"],
  "Europe/Kyiv":["UA","🇺🇦","우크라이나"], "Europe/Bucharest":["RO","🇷🇴","루마니아"],
  "America/New_York":["US","🇺🇸","미국 (동부)"], "America/Detroit":["US","🇺🇸","미국 (동부)"],
  "America/Toronto":["CA","🇨🇦","캐나다 (동부)"], "America/Chicago":["US","🇺🇸","미국 (중부)"],
  "America/Denver":["US","🇺🇸","미국 (산악)"], "America/Phoenix":["US","🇺🇸","미국 (애리조나)"],
  "America/Los_Angeles":["US","🇺🇸","미국 (서부)"], "America/Vancouver":["CA","🇨🇦","캐나다 (서부)"],
  "America/Anchorage":["US","🇺🇸","미국 (알래스카)"], "Pacific/Honolulu":["US","🇺🇸","미국 (하와이)"],
  "America/Mexico_City":["MX","🇲🇽","멕시코"], "America/Sao_Paulo":["BR","🇧🇷","브라질"],
  "America/Bogota":["CO","🇨🇴","콜롬비아"], "America/Lima":["PE","🇵🇪","페루"],
  "America/Argentina/Buenos_Aires":["AR","🇦🇷","아르헨티나"], "America/Santiago":["CL","🇨🇱","칠레"],
  "Australia/Sydney":["AU","🇦🇺","호주 (시드니)"], "Australia/Melbourne":["AU","🇦🇺","호주 (멜버른)"],
  "Australia/Brisbane":["AU","🇦🇺","호주 (브리즈번)"], "Australia/Perth":["AU","🇦🇺","호주 (퍼스)"],
  "Pacific/Auckland":["NZ","🇳🇿","뉴질랜드"],
  "Africa/Johannesburg":["ZA","🇿🇦","남아공"], "Africa/Cairo":["EG","🇪🇬","이집트"],
  "Africa/Lagos":["NG","🇳🇬","나이지리아"], "Africa/Nairobi":["KE","🇰🇪","케냐"]
};
function tzLabel(tz){
  if(!tz) return "❓ 알 수 없음";
  var m = TZC[tz];
  if(m) return m[1] + " " + m[2];
  return "🌐 " + tz.replace(/_/g," ");
}
function refLabel(h){
  if(!h || h === "(direct)") return "🔗 직접 접속 · QR · 앱";
  var s = h.toLowerCase();
  if(s.indexOf("reddit")>=0)    return "👽 Reddit";
  if(s.indexOf("threads")>=0)   return "🧵 Threads";
  if(s.indexOf("instagram")>=0) return "📷 Instagram";
  if(s.indexOf("facebook")>=0 || s.indexOf("fb.")>=0) return "📘 Facebook";
  if(s.indexOf("google")>=0)    return "🔍 Google";
  if(s.indexOf("naver")>=0)     return "🟢 Naver";
  if(s.indexOf("t.co")>=0 || s.indexOf("twitter")>=0 || s.indexOf("x.com")>=0) return "✖️ X / Twitter";
  if(s.indexOf("lepetitjournal")>=0) return "🇫🇷 Le Petit Journal";
  if(s.indexOf("tripadvisor")>=0)    return "🦉 TripAdvisor";
  if(s.indexOf("youtube")>=0)   return "▶️ YouTube";
  if(s.indexOf("skinny-us")>=0 || s.indexOf("sknyus")>=0) return "🏠 내 사이트";
  return "🌍 " + h;
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ───────── 상태 ───────── */
var KEY = "", DAYS = 30, DATA = null, LOADING = false;
function sg(k){ try{ return sessionStorage.getItem(k)||""; }catch(e){ return ""; } }
function ss(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }

/* ───────── 화면 ───────── */
function login(){
  document.getElementById('tb-right').textContent = "";
  document.getElementById('body').innerHTML =
    '<div class="title">Visitors</div>' +
    '<div class="sub">누가, 어디서, 무엇을 보고 있는지.</div>' +
    (ANALYTICS_API ? '' :
      '<div class="err" style="display:block">⚠️ visits.html 안의 <b>ANALYTICS_API</b> 가 비어 있습니다. Apps Script 배포 URL을 넣어주세요.</div>') +
    '<input class="in" id="pw" type="password" placeholder="ADMIN_KEY" autocomplete="off">' +
    '<button class="btn" onclick="doLogin()">Open</button>' +
    '<div class="err" id="err"></div>' +
    '<div class="hint">비밀번호 = sknyus-analytics Apps Script 의 <b>ADMIN_KEY</b> 값입니다.<br>' +
    '이 페이지는 검색엔진에 노출되지 않습니다 (noindex).</div>';
  var el = document.getElementById('pw');
  el.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  el.focus();
}
function doLogin(){
  KEY = document.getElementById('pw').value.trim();
  if(!KEY){ return fail("비밀번호를 입력하세요."); }
  ss('sknyus_ak', KEY);
  load();
}
function fail(m){
  var e = document.getElementById('err');
  if(e){ e.innerHTML = m; e.style.display='block'; }
}
function logout(){ try{ sessionStorage.removeItem('sknyus_ak'); }catch(e){} KEY=""; DATA=null; login(); }

function load(){
  if(!ANALYTICS_API){ return fail("ANALYTICS_API 가 비어 있습니다."); }
  if(LOADING) return;
  LOADING = true;
  document.getElementById('tb-right').textContent = "loading…";
  fetch(ANALYTICS_API + "?action=stats&days=" + DAYS + "&key=" + encodeURIComponent(KEY))
    .then(function(r){ return r.json(); })
    .then(function(d){
      LOADING = false;
      if(!d || !d.ok){
        document.getElementById('tb-right').textContent = "";
        if(!DATA) login();
        return fail(d && d.error === "bad key" ? "비밀번호가 틀립니다." : "불러오지 못했습니다: " + esc((d&&d.error)||"unknown"));
      }
      DATA = d; render();
    })
    .catch(function(){
      LOADING = false;
      document.getElementById('tb-right').textContent = "";
      if(!DATA) login();
      fail("연결 실패. 배포 URL이 맞는지, 액세스 권한이 <b>모든 사용자</b>인지 확인해주세요.");
    });
}
function setDays(n){ DAYS = n; load(); }

function bars(list, labelFn){
  if(!list || !list.length) return '<div class="empty">아직 데이터가 없습니다.</div>';
  var max = list[0].n || 1;
  return '<div class="bars">' + list.map(function(x){
    var pct = Math.max(3, Math.round(x.n / max * 100));
    return '<div class="bar"><span class="fill" style="width:'+pct+'%"></span>' +
           '<span class="lb">' + esc(labelFn ? labelFn(x.k) : x.k) + '</span>' +
           '<span class="nb">' + x.n + '</span></div>';
  }).join('') + '</div>';
}

function render(){
  var d = DATA, f = d.funnel || {};
  var pct = function(a,b){ return b ? Math.round(a/b*100) + "%" : "—"; };

  var spark = "";
  if(d.byDay && d.byDay.length){
    var mx = 1; d.byDay.forEach(function(x){ if(x.n>mx) mx=x.n; });
    spark = '<div class="spark">' + d.byDay.map(function(x){
      return '<i style="height:'+Math.max(2, Math.round(x.n/mx*100))+'%" title="'+esc(x.k)+' · '+x.n+'"></i>';
    }).join('') + '</div>';
  }

  var rec = (d.recent||[]).map(function(r){
    var cls = ({pay:'pay',join:'join',pick:'pick',member:'member'})[r.event] || '';
    return '<tr><td>' + esc(r.ts) + '</td>' +
      '<td><span class="tag ' + cls + '">' + esc(r.event) + '</span> ' + esc(r.detail||'') + '</td>' +
      '<td>' + esc(tzLabel(r.tz)) + '<br><span style="color:#B99">' + esc(refLabel(r.refhost)) + '</span></td></tr>';
  }).join('');

  document.getElementById('tb-right').textContent = d.total + " events";
  document.getElementById('body').innerHTML =
    '<div class="title">Visitors</div>' +
    '<div class="sub">최근 ' + d.days + '일 · 누가, 어디서, 무엇을 보고 있는지.</div>' +

    '<div class="range">' +
      ['7','30','90'].map(function(n){
        return '<button class="'+(DAYS==n?'on':'')+'" onclick="setDays('+n+')">'+n+'일</button>';
      }).join('') +
    '</div>' +

    '<div class="kpis">' +
      '<div class="kpi"><b>' + (d.visitors||0)   + '</b><span>방문자</span></div>' +
      '<div class="kpi"><b>' + (f.visit||0)      + '</b><span>페이지뷰</span></div>' +
      '<div class="kpi"><b>' + (d.sessions||0)   + '</b><span>세션</span></div>' +
      '<div class="kpi"><b>' + (f.pay||0)        + '</b><span>결제 클릭</span></div>' +
    '</div>' +
    spark +

    '<div class="sec">어디서 보는지 <small>· 접속 국가</small></div>' + bars(d.byTz, tzLabel) +
    '<div class="sec">어떻게 들어왔는지 <small>· 유입 사이트</small></div>' + bars(d.byRef, refLabel) +
    '<div class="sec">캠페인 <small>· ?src= 태그 (QR 카드 · 채널별)</small></div>' + bars(d.bySrc) +

    '<div class="sec">퍼널</div>' +
    '<div class="fn">' +
      '<div class="fnrow"><span>사이트 방문</span><b>' + (f.visit||0)  + '</b></div>' +
      '<div class="fnrow"><span>픽 상세 열람</span><b>' + (f.pick||0)  + '<em>' + pct(f.pick,f.visit)  + '</em></b></div>' +
      '<div class="fnrow"><span>Join 페이지</span><b>'  + (f.join||0)  + '<em>' + pct(f.join,f.visit)  + '</em></b></div>' +
      '<div class="fnrow"><span>PayPal 클릭</span><b>'  + (f.pay||0)   + '<em>' + pct(f.pay,f.visit)   + '</em></b></div>' +
      '<div class="fnrow"><span>코드 입력 성공</span><b>' + (f.member||0)+ '<em>' + pct(f.member,f.visit)+ '</em></b></div>' +
    '</div>' +

    '<div class="sec">많이 본 픽</div>'      + bars(d.byPick) +
    '<div class="sec">많이 본 카테고리</div>' + bars(d.byView) +

    '<div class="sec">최근 활동</div>' +
    '<table class="tb">' + (rec || '<tr><td colspan="3">아직 기록이 없습니다.</td></tr>') + '</table>' +

    '<div class="foot">' +
      '<button class="ghost" onclick="load()">새로고침</button>' +
      '<a class="ghost" href="admin.html">Admin</a>' +
      '<a class="ghost" href="https://www.paypal.com/activities" target="_blank" rel="noopener">PayPal ↗</a>' +
      '<button class="ghost" onclick="logout()">로그아웃</button>' +
    '</div>';
}

/* 시작 */
KEY = sg('sknyus_ak');
if(KEY && ANALYTICS_API) load(); else login();
</script>
</body>
</html>
