<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin · Skinny-us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Yellowtail&family=Space+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --white:#FFFFFF; --cream:#FDFBF7; --line:#F1E9E0;
    --ink:#A8305C; --ink-mid:#C05A82; --ink-soft:#D0739A;
    --g1:#F8C8DA; --g2:#F0AEC4; --g3:#E095AE;
    --gx:20px;  /* section side padding */
    --gm:14px;  /* hero side margin */
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); }
  .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:rgba(255,252,250,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .topbar .tb-left { display:flex; align-items:center; gap:10px; }
  .topbar .backchip { width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:999px; border:1px solid var(--line); background:var(--cream); color:#111; font-size:15px; text-decoration:none; }
  .topbar .wordmark { font-family:'Yellowtail',cursive; font-weight:400; font-size:24px; color:var(--ink); text-decoration:none; }
  .topbar .wordmark em { font-style:normal; color:var(--ink-soft); }

  /* ═══ ADMIN ═══ */
  .adm-wrap { max-width:560px; margin:0 auto; padding:26px 20px 60px; }
  .adm-title { font-family:'Instrument Serif',serif; font-style:italic; font-size:30px; margin-bottom:4px; }
  .adm-sub { font-size:12px; color:var(--ink-mid); margin-bottom:22px; }
  .adm-input { width:100%; font-family:'Space Mono',monospace; font-size:16px; letter-spacing:0.3em; text-align:center; padding:14px; border-radius:20px; border:2px solid var(--line); outline:none; color:#111; }
  .adm-input:focus { border-color:#111; }
  .adm-btn { display:block; width:100%; margin-top:12px; padding:14px; border:none; border-radius:20px; cursor:pointer; font-family:inherit; font-size:14px; font-weight:700; color:#111; background:linear-gradient(155deg,var(--g1),var(--g2)); }
  .adm-err { font-size:12px; color:#C0392B; margin-top:10px; text-align:center; display:none; }
  .adm-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:20px; }
  .adm-stat { background:var(--cream); border:1px solid var(--line); border-radius:16px; padding:13px 14px; }
  .adm-stat b { display:block; font-family:'Space Mono',monospace; font-size:20px; color:#111; }
  .adm-stat span { font-size:10.5px; font-weight:600; color:var(--ink-mid); }
  .adm-sec { font-family:'Space Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-mid); margin:22px 0 10px; }
  .adm-links a { display:block; padding:13px 15px; margin-bottom:8px; border:1px solid var(--line); border-radius:16px; text-decoration:none; font-size:13px; font-weight:600; color:#111; background:var(--white); }
  .adm-log { width:100%; border-collapse:collapse; font-size:11.5px; }
  .adm-log td { padding:7px 6px; border-bottom:1px solid var(--line); color:var(--ink); }
  .adm-log td:first-child { color:var(--ink-soft); white-space:nowrap; }
  .adm-clear { margin-top:16px; background:none; border:1px solid var(--line); border-radius:999px; padding:9px 16px; font-family:inherit; font-size:12px; font-weight:600; color:var(--ink-mid); cursor:pointer; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="tb-left">
      <a class="backchip" href="index.html" aria-label="Back">←</a>
      <a class="wordmark" href="index.html">skinny-<em>us</em></a>
    </span>
    <span></span>
  </div>
  <div class="adm-wrap" id="admin-body"></div>

<script>
  function sGet(store, k){ try { return window[store].getItem(k); } catch(e){ return null; } }
  function sSet(store, k, v){ try { window[store].setItem(k, v); } catch(e){} }
  function track(ev){
    try{
      var arr = JSON.parse(localStorage.getItem('su_log') || '[]');
      arr.push({ t: Date.now(), e: ev });
      if (arr.length > 300) arr = arr.slice(-300);
      localStorage.setItem('su_log', JSON.stringify(arr));
    }catch(e){}
  }

  var ADMIN_PW = "8603";
  function logCounts() {
    var arr = []; try { arr = JSON.parse(localStorage.getItem('su_log') || '[]'); } catch (e) {}
    var c = {}; arr.forEach(function (x) { c[x.e] = (c[x.e] || 0) + 1; });
    return { arr: arr, c: c };
  }
  function checkAdmin() {
    var v = document.getElementById('adm-pw').value;
    if (v === ADMIN_PW) { sSet('sessionStorage', 'su_admin', '1'); renderAdmin(); }
    else { document.getElementById('adm-err').style.display = 'block'; }
  }
  function adminLogout() { try { sessionStorage.removeItem('su_admin'); } catch (e) {} renderAdmin(); }
  function clearLog() { try { localStorage.removeItem('su_log'); } catch (e) {} renderAdmin(); }
  function renderAdmin() {
    var el = document.getElementById('admin-body');
    if (!el) return;
    if (sGet('sessionStorage', 'su_admin') !== '1') {
      el.innerHTML = '<div class="adm-title">Admin</div>' +
        '<div class="adm-sub">Enter password to continue.</div>' +
        '<input class="adm-input" id="adm-pw" type="password" inputmode="numeric" maxlength="8" placeholder="••••">' +
        '<button class="adm-btn" onclick="checkAdmin()">Log in</button>' +
        '<div class="adm-err" id="adm-err">Wrong password.</div>';
      return;
    }
    var d = logCounts(), c = d.c;
    var stat = function (n, label) { return '<div class="adm-stat"><b>' + (n || 0) + '</b><span>' + label + '</span></div>'; };
    var rows = d.arr.slice(-30).reverse().map(function (x) {
      var dt = new Date(x.t);
      var ts = (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' + ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2);
      return '<tr><td>' + ts + '</td><td>' + x.e + '</td></tr>';
    }).join('');
    el.innerHTML = '<div class="adm-title">Admin</div>' +
      '<div class="adm-sub">이 브라우저에 기록된 활동입니다. 실제 결제/고객 정보는 PayPal에 있습니다.</div>' +
      '<div class="adm-stats">' +
        stat(c['view:entry'], 'Front page views') +
        stat(c['view:gate'], 'Gate (Korea) views') +
        stat(c['view:join'], 'Join page views') +
        stat((c['paypal:monthly']||0)+(c['paypal:single']||0)+(c['paypal:consult']||0), 'PayPal clicks') +
        stat(c['member:enter'], 'Member entries') +
      '</div>' +
      '<div class="adm-sec">Plan interest</div>' +
      '<div class="adm-stats">' +
        stat(c['plan:monthly'], 'Monthly selected') + stat(c['plan:single'], 'One-trip selected') + stat(c['plan:consult'], 'Consult selected') +
      '</div>' +
      '<div class="adm-sec">Payments &amp; data</div>' +
      '<div class="adm-links">' +
        '<a href="https://www.paypal.com/activities" target="_blank" rel="noopener">PayPal 거래내역 (결제·고객 정보) ↗</a>' +
        '<a href="https://docs.google.com/spreadsheets/d/1FtW96csH5-p38TJyMb7JJd_stepndnncITlkNHXGcGc/edit" target="_blank" rel="noopener">콘텐츠 구글 시트 ↗</a>' +
      '</div>' +
      '<div class="adm-sec">Recent events</div>' +
      '<table class="adm-log">' + (rows || '<tr><td colspan="2">No events yet.</td></tr>') + '</table>' +
      '<button class="adm-clear" onclick="clearLog()">Clear local log</button> ' +
      '<button class="adm-clear" onclick="adminLogout()">Log out</button>';
  }
  renderAdmin();
</script>
</body>
</html>
