<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#02060c">
<title>AHRAN · Personal OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='10' fill='%2302060c'/%3E%3Ccircle cx='22' cy='22' r='14' fill='none' stroke='%23ffffff33' stroke-width='2'/%3E%3Cpath d='M22 8a14 14 0 0 1 13.3 18.3' fill='none' stroke='%239fe8ff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='35.3' cy='26.3' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=28">
</head>
<body>
<div class="lock" aria-hidden="false">
  <form id="lockForm" class="lockbox" autocomplete="on">
    <svg width="48" height="48" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="17" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/><path d="M22 5a17 17 0 0 1 16.2 22.2" fill="none" stroke="#9fe8ff" stroke-width="1.6" stroke-linecap="round"/><circle cx="38.2" cy="27.2" r="2.2" fill="#fff"/><circle cx="22" cy="22" r="1.4" fill="rgba(255,255,255,.55)"/></svg>
    <b>AHRAN</b>
    <input type="text" name="username" value="ahran" autocomplete="username" hidden>
    <input id="lockPw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호">
    <label><input id="lockRemember" type="checkbox" checked> 이 기기에서 기억하기</label>
    <button type="submit">열기</button>
    <small id="lockMsg"></small>
  </form>
</div>
<div class="wrap">
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="17" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/><path d="M22 5a17 17 0 0 1 16.2 22.2" fill="none" stroke="#9fe8ff" stroke-width="1.6" stroke-linecap="round"/><circle cx="38.2" cy="27.2" r="2.2" fill="#fff"/><circle cx="22" cy="22" r="1.4" fill="rgba(255,255,255,.55)"/></svg>
    <div><b>AHRAN</b><small>PERSONAL OPERATING SYSTEM</small></div>
  </div>
  <nav>
    <a href="./" class="on">TODAY</a><a href="projects.html">PROJECTS</a><a href="haim.html">하임</a><a href="#" id="lockBtn" title="잠그기">🔒</a>
  </nav>
  <div class="hspace" aria-hidden="true"></div>
</header>

<section class="hero" aria-label="지금">
  <div class="hero-time"><div class="t" id="clock">--:--<span></span></div><div class="d" id="clockDate">&nbsp;</div></div>
  <div class="hero-now"><div class="treeinfo" id="treeInfo"></div><div class="treenote" id="treeNote"></div></div>
</section>

<div class="cmdwrap" id="top">
  <form class="cmd" id="cmdForm" autocomplete="off">
    <span class="pr">&gt;_</span>
    <input id="cmd" type="text" placeholder="무엇이든 입력하세요 · 예: 오늘 일정 정리, 도쿄 날씨, 할 일 추가 운동" aria-label="명령어">
    <span class="kbd">단축키 /</span>
    <button class="go" type="submit" aria-label="실행"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h9M7.5 3l4 4-4 4" stroke="#4fd6ff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
  </form>
  <div class="reply" id="reply"></div>
</div>

<div class="stage">
  <div class="col">
    <section class="panel brief">
      <div class="ph"><span class="pt">DAILY BRIEFING</span><span class="tag" id="briefTime">—</span></div>
      <div id="brief"><p class="muted">불러오는 중…</p></div>
    </section>

    <section class="panel" id="schedule">
      <div class="ph"><span class="pt">SCHEDULE</span><span class="tag" id="calSrc">GOOGLE CALENDAR</span></div>
      <div id="sched"></div>
    </section>

    <section class="panel">
      <div class="ph"><span class="pt">TO-DO</span><span class="tag" id="todoCount">0</span></div>
      <div id="todos"></div>
    </section>
  </div>

  <div class="center" id="life">
    <div class="treebox scene">
      <svg id="tree" viewBox="0 0 620 600" aria-hidden="true"></svg>
      <svg id="bodies" viewBox="0 0 620 600" role="img" aria-label="원아란과 고양이 하임의 오늘 컨디션"></svg>
      <div id="figs"></div>
      <div id="callouts"></div>
    </div>
    <div class="cond-cards" id="condCards"></div>
    <div class="areas" id="nodes"></div>
  </div>

  <div class="col">
    <section class="panel">
      <div class="ph"><span class="pt">DAILY BIO INDEX</span><span class="tag" id="bioDay">—</span></div>
      <div class="bio-row" id="bioVals"></div>
      <svg id="bio" viewBox="0 0 302 100"></svg>
      <div class="note" id="bioNote"></div>
    </section>

    <section class="panel">
      <div class="ph"><span class="pt">DAY PLAN</span><span class="tag" id="dayKind">—</span></div>
      <svg id="dayplan" viewBox="-14 -14 328 328" role="img" aria-label="오늘 24시간 시간표"></svg>
      <p class="note" id="dayNow"></p>
    </section>

    <section class="panel">
      <div class="ph"><span class="pt">YEAR PROGRESS</span><span class="tag" id="weekNo">—</span></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end"><span class="big" id="yearPct">0<span>%</span></span><span class="muted" style="font-size:13px" id="yearTxt"></span></div>
      <div class="yp" id="yearBar"></div>
    </section>
  </div>
</div>

<div class="sec" id="world"><span class="pt">GLOBAL · 5 CITIES</span><span class="muted" style="font-size:13px">시간 · 날씨 · 미세먼지 · 현지 통화 환율 (원)</span></div>
<div class="world" id="cities"></div>

<div class="sec" id="projects"><span class="pt">PROJECTS</span><a class="sec-link" href="projects.html">전체 보기 →</a><span class="muted" style="font-size:13px" id="repoCount"></span></div>
<div class="repos" id="repos"></div>

<div class="strip" id="strip"></div>
</div>

<div class="pj-modal" id="hModal" hidden><div class="pj-sheet" id="hSheet" role="dialog" aria-modal="true" aria-label="하임 건강 기록"><button class="pj-close" id="hClose" type="button" aria-label="닫기">✕</button><div id="hBody"></div></div></div>
<script src="lock.js?v=28"></script>
<script src="tree.js?v=28"></script>
<script src="body.js?v=28"></script>
<script src="haimcore.js?v=28"></script>
<script src="app.js?v=28"></script>
</body>
</html>
